services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    stop_grace_period: 30s
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DATA_DIR: /app/data
      # Existing credits only. No top-ups, paid fallback or Twitter credentials.
      UMANS_API_KEY: ${UMANS_API_KEY:-}
      LOGFARE_API_KEY: ${LOGFARE_API_KEY:-}
      AI_CHAT_ENABLED: ${AI_CHAT_ENABLED:-true}
      OPENAI_RESET_ENABLED: ${OPENAI_RESET_ENABLED:-true}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      VERCEL_TOKEN: ${VERCEL_TOKEN:-}
      PREVIEW_CACHE_SIZE: ${PREVIEW_CACHE_SIZE:-100}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - npm_cache:/home/node/.npm
      - bot_data:/app/data

volumes:
  node_modules:
  npm_cache:
  bot_data:
