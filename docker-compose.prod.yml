services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      DISCORD_TOKEN: ${DISCORD_TOKEN:?Supply the production bot token}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?Supply the application ID}
      DATA_DIR: /app/data
      PREVIEW_CACHE_SIZE: ${PREVIEW_CACHE_SIZE:-100}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - bot_data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  bot_data:
